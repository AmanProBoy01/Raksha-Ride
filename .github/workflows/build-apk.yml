name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Yatra Rakshaka APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Latest Web Code to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html style.css app.js manifest.json sw.js android/app/src/main/assets/www/
          cp -r assets android/app/src/main/assets/www/

      - name: Build APK with Gradle
        working-directory: android
        run: |
          gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Organize APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/YatraRakshaka.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YatraRakshaka-APK
          path: build-output/YatraRakshaka.apk
          retention-days: 30
